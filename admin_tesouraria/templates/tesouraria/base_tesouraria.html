{% extends 'base_sem.html' %}
{% load static %}

{% block content %}
<div class="container-fluid bg-dark min-vh-100 p-0">
    <!-- Navbar fixa superior -->
    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary sticky-top" style="z-index: 1030;">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-cash-register me-2"></i>{{ titulo }}
            </span>
            <div class="d-flex align-items-center">
                <span class="text-light me-3">{{ user.get_full_name }}</span>
                <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-danger">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </a>
            </div>
        </div>
    </nav>

    <div class="d-flex" style="margin-top: 58px;">
        <!-- Menu lateral -->
        <nav id="sidebar" class="bg-dark border-end border-secondary" style="width: 250px; height: calc(100vh - 58px); overflow-y: auto; position: fixed; left: 0; top: 58px;">
            <div class="p-3">
                <h6 class="text-light text-uppercase mb-3">Tesouraria</h6>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link text-light" href="{% url 'admin_tesouraria:index' %}">
                            <i class="fas fa-home me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" href="{% url 'admin_tesouraria:caixa_listar' %}">
                            <i class="fas fa-boxes me-2"></i> Caixas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" href="{% url 'admin_tesouraria:relatorio' %}">
                            <i class="fas fa-chart-bar me-2"></i> Relatórios
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Conteúdo principal -->
        <main class="flex-grow-1" style="margin-left: 250px; padding: 20px;">
            {% include 'parciais/_messages.html' %}
            
            {% block tesouraria_content %}
            {% endblock %}
        </main>
    </div>
</div>

<style>
    #sidebar {
        transition: all 0.3s ease;
    }
    
    .nav-link {
        transition: all 0.3s ease;
        border-radius: 0.25rem;
    }
    
    .nav-link:hover {
        background-color: rgba(255, 255, 255, 0.1);
        color: #0d6efd !important;
    }
    
    .nav-link.active {
        background-color: #0d6efd;
        color: white !important;
    }
</style>

{% endblock %}
