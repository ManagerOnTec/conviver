{% load static %}



{% if titulo and cad_index %}

<div id="func-menu" class="fixed-top bg-primary d-flex justify-content-between align-items-center p-2 shadow-sm">
    <div class="d-flex align-items-center">
        <!-- Ícone do Módulo (Opcional, similar ao logo do Gemini) -->
        <i class="fas fa-cube text-white mr-2" style="font-size: 1.5rem;"></i>
        <h5 class="text-white mb-0 ml-2" style="font-weight: 500;">{{ titulo }}</h5>
    </div>

    <div class="d-flex gap-2">
         <a title="Função 1" href="{{ list_index }}" class="btn btn-sm btn-outline-light d-flex align-items-center justify-content-center" style="width: 35px; height: 35px; border-radius: 50%;">
            <i class="fas fa-paste"></i>
        </a>
        <a title="Fechar" href="{{ cad_index }}" class="btn btn-sm btn-outline-light d-flex align-items-center justify-content-center" style="width: 35px; height: 35px; border-radius: 50%;">
            <i class="fas fa-times"></i>
        </a>
    </div>
</div>

{% else %}
<div id="func-menu" style="width: var(--sidebar-width, 225px);" class="bg-primary d-flex justify-content-start align-items-center p-2">
    <h5 class="text-white mb-0">{{ titulo }}</h5>
</div>
{% endif %}





<div id="nav-div" class="fixed-top" style="margin-left: var(--sidebar-width, 225px); width: calc(100% - var(--sidebar-width, 225px));">
    <nav id="nav-bar" class="navbar bg-dark">
        <div class="top-nav-inner">
            <div class="top-nav-primary">
                <button id="toggle-button" class="top-nav-button top-nav-icon-button btn btn-sm btn-dark" aria-label="Ocultar menu lateral">
                    <i class="fas fa-bars text-light"></i>
                </button>
                <a href="{% url 'select_estabelecimento' %}" class="top-nav-button btn btn-sm btn-dark buttonnav">
                    Home
                </a>
                <a class="top-nav-button btn btn-sm btn-dark buttonnav" type="button" href="{% url 'logout' %}">Encerrar sessão</a>
            </div>

            <div class="top-nav-secondary">
            <button class="top-nav-button top-nav-icon-button btn btn-sm btn-dark buttonnav" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar">
                <i class="fas fa-user text-light"></i>
            </button>
            </div>


        </div>


        <div class="offcanvas offcanvas-end bg-dark text-white" tabindex="-1" id="offcanvasDarkNavbar"
            aria-labelledby="offcanvasDarkNavbarLabel" style="z-index: 1050;">
            <div class="offcanvas-header">
                <button type="button" class="btn-close btn-close-white text-reset" data-bs-dismiss="offcanvas"
                    aria-label="Fechar"></button>
            </div>
            <div class="offcanvas-body">
                <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                    <li class="nav-item">
                        <a class="rounded nav-link text-white" href="{% url 'select_estabelecimento' %}"
                            onmouseover="this.style.backgroundColor='#000000';"
                            onmouseout="this.style.backgroundColor='';">
                            <i class="fas fa-building me-2"></i>Estabelecimentos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="rounded nav-link text-white" href="{% url 'alterar' %}"
                            onmouseover="this.style.backgroundColor='#000000';"
                            onmouseout="this.style.backgroundColor='';"><i class="fas fa-key me-2"></i>Alterar
                            senha</a>
                    </li>
                    <li class="nav-item">
                        <a class="rounded nav-link text-white" href="{% url 'logout' %}"
                            onmouseover="this.style.backgroundColor='#000000';"
                            onmouseout="this.style.backgroundColor='';"><i class="fas fa-sign-out-alt me-2"></i>Encerrar
                            sessão</a>
                    </li>
                </ul>
            </div>
        </div>

    </nav>
</div>
