{% load static %}
{% if messages %}
<div id="message-container" style="display: none;"> <!-- Container oculto inicialmente -->
    {% for message in messages %}
    {% comment %}
      Cores do AGENTS.md (item 6): sucesso verde, alerta amarelo, perigo
      vermelho — classes canônicas + as do Bootstrap, conforme o `MESSAGE_TAGS`.
    {% endcomment %}
    <div class="alert {{ message.tags }} alert-dismissible fade show mb-0 d-flex justify-content-center align-items-center{% if 'success' in message.tags %} msg-success{% elif 'warning' in message.tags or 'alert' in message.tags %} msg-warning{% elif 'error' in message.tags or 'danger' in message.tags %} msg-error{% else %} msg-info{% endif %}"
        style="font-size: 14px;">
        <span>Resposta: {{ message }}</span>
    </div>
    {% endfor %}
</div>

<script>
    // Use setTimeout para exibir as mensagens depois de meio segundo
    setTimeout(function () {
        // Exibir o container de mensagens
        $('#message-container').fadeIn('fast');
        // Depois de 3 segundos, esconda o container de mensagens
        setTimeout(function () {
            $('#message-container').fadeOut('slow', function () {
                // Após desaparecer, remova-o do DOM
                $(this).remove();
            });
        }, 5000); // Define que as mensagens ficarão visíveis por 3 segundos
    }, 500); // Mensagens aparecem após meio segundo
</script>
{% endif %}
