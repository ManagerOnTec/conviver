{% extends "admin/base_site.html" %}
{% load i18n admin_urls %}

{% block content %}
<div id="content-main">
  <form method="post" novalidate>
    {% csrf_token %}
    <div>
      <p>Confirma a geração da fatura para esta pré-fatura?</p>
      <p><strong>{{ prefatura.convenio }}</strong> — {{ prefatura.cliente }} — {{ prefatura.competencia|date:"d/m/Y" }}</p>
    </div>
    <div class="submit-row">
      <input type="submit" value="Confirmar faturamento" class="default">
      <a href="{% url 'admin:admin_faturas_prefatura_changelist' %}" class="button cancel-link">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
