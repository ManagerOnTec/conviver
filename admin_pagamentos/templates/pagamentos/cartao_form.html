{% extends 'base_sem.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block titulos %}{{ title }}|{% endblock %}

{% block content %}
<div class="container-fluid bg-dark min-vh-90 rounded p-4">
    <div class="row mb-4">
        <div class="col-md-12">
            <h2 class="text-white">
                <i class="fas fa-credit-card me-2"></i>{{ titulo }}
            </h2>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8">
            <div class="card bg-secondary">
                <div class="card-body">
                    <form method="post" class="form">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="row mt-4">
                            <div class="col-md-12">
                                <button type="submit" class="btn btn-success me-2">
                                    <i class="fas fa-save me-2"></i>Salvar
                                </button>
                                <a href="{% url 'admin_pagamentos:cartao_listar' %}" class="btn btn-secondary">
                                    <i class="fas fa-times me-2"></i>Cancelar
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
